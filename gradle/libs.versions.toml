[versions]
accompanistSystemuicontroller = "0.17.0"
agp = "8.7.3"
datastorePreferences = "1.1.7"
extensionOkhttp = "2.19.1"
kotlin = "2.0.0"
coreKtx = "1.16.0"
hilt = "2.50"
composeBom = "2025.06.01"
compose = "1.7.8"
espressoCore = "3.6.1"
junitVersion = "1.2.1"
junit = "4.13.2"
material3android = "1.3.2"
material3="1.4.0-alpha16"
activityCompose = "1.10.1"
lifecycleRuntimeKtx = "2.9.1"
kakaosdk = "2.12.1"
browser = "1.8.0"
legacysupportcoreutil = "1.0.0"
okhttp = "5.0.0-alpha.2"
retrofit = "2.9.0"
securitycrypto = "1.1.0-beta01"
navercorpnidoauth = "5.10.0"
hiltnavigationcompose = "1.2.0"
hiltcompiler = "1.2.0"
navigationcompose = "2.9.0"
serializationjson = "1.7.3"
coroutines = "1.9.0"
coil3 = "3.0.4"
androidlibrary = "8.2.2"
appcompat = "1.7.1"
material = "1.12.0"
composematerial = "1.8.3"
ksp = "2.0.0-1.0.22"
snapper = "0.2.2"
serviceslocation = "21.3.0"
accompanistpager="0.28.0"
exoplayer = "1.8.0"
media3DatasourceOkhttp = "1.8.0"

[libraries]
accompanist-systemuicontroller = { module = "com.google.accompanist:accompanist-systemuicontroller", version.ref = "accompanistSystemuicontroller" }
extension-okhttp = { module = "com.google.android.exoplayer:extension-okhttp", version.ref = "extensionOkhttp" }
media3-ui = {module = "androidx.media3:media3-ui",version.ref = "exoplayer"}
#exoplayer
exoplayer = {module="androidx.media3:media3-exoplayer",version.ref = "exoplayer"}
#retrofit
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

#datastore
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastorePreferences" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
#coil
coil3-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3"}
coil3-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil3"}
#coroutine
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

#dagger-hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt"}
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt"}
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltcompiler"}
#serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationjson"}
#compose navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationcompose"}
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltnavigationcompose"}
#네이버 로그인
navercorp-nid-oauth = { group = "com.navercorp.nid", name = "oauth", version.ref = "navercorpnidoauth"}
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securitycrypto"}

support-core-utils = { group = "androidx.legacy", name = "legacy-support-core-utils", version.ref = "legacysupportcoreutil"}
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser"}
#카카오 로그인
kakao-v2-all = { group = "com.kakao.sdk", name = "v2-all", version.ref = "kakaosdk"}
kakao-v2-user = { group = "com.kakao.sdk", name = "v2-user", version.ref = "kakaosdk"}

#구글 위치
service-location = {group = "com.google.android.gms", name = "play-services-location", version.ref = "serviceslocation"}
#snapping fling behavior
dev-chrisbanes-snapper = { group = "dev.chrisbanes.snapper", name = "snapper", version.ref = "snapper" }
#tabrow
accompanist-pager = { group = "com.google.accompanist",name="accompanist-pager",version.ref="accompanistpager"}
accompanist-pager-indicators ={ group = "com.google.accompanist",name="accompanist-pager-indicators",version.ref="accompanistpager"}
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3-android = { group = "androidx.compose.material3", name = "material3-android", version.ref = "material3android" }
androidx-material3 = {group = "androidx.compose.material3", name="material3",version.ref = "material3"}
androidx-material = { group = "androidx.compose.material", name = "material", version.ref = "composematerial"}
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat"}
material = { group = "com.google.android.material", name = "material", version.ref = "material"}
material-icons = { group = "androidx.compose.material", name = "material-icons-extended",version.ref = "compose"}
ui = { module = "androidx.compose.ui:ui" }
ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3DatasourceOkhttp" }
[plugins]
#parcelize
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "androidlibrary" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp"}
